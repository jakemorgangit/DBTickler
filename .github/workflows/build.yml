name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create and publish a release for, e.g. v2.0.0. Leave blank to just build."
        required: false
        default: ""

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    # The core library, the CLI and the test suite are all platform-neutral, so the fast
    # checks run on Linux. The WPF app is cross-compiled here too, which catches XAML and
    # binding errors without needing a Windows runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  package:
    name: Publish Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    # Needed to attach executables to a release. Repositories that default the workflow
    # token to read-only would otherwise fail only on tag builds, long after the change.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish desktop app
        run: >
          dotnet publish src/DBTickler.App/DBTickler.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/app

      - name: Publish command-line tool
        run: >
          dotnet publish src/DBTickler.Cli/DBTickler.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/cli

      # The desktop app publishes as DBTickler.exe and the CLI as dbtickler.exe, which differ
      # only by case. Attaching both to one release collides, and it is confusing to download.
      - name: Give the CLI a distinct asset name
        shell: pwsh
        run: Rename-Item publish/cli/dbtickler.exe dbtickler-cli.exe

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dbtickler-win-x64
          path: |
            publish/app/DBTickler.exe
            publish/cli/dbtickler-cli.exe
          if-no-files-found: error

      # A release can be cut two ways: by pushing a v* tag, or by running this workflow
      # manually with release_tag set. The second route exists because a push credential
      # scoped to branches cannot create tags, whereas the workflow token can.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            publish/app/DBTickler.exe
            publish/cli/dbtickler-cli.exe
          # Curated notes for the release being cut. Update this file before tagging;
          # the auto-generated commit list is appended beneath it.
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true

      # Creating a release sets its body, but updating an existing one leaves the body alone,
      # so a re-cut would silently keep stale notes. Force the published notes to match the
      # file in this commit.
      - name: Sync the release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
